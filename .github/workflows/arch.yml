name: Arch Linux package

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arch:
    name: Arch x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    container:
      image: archlinux:base-devel
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            git git-lfs github-cli sudo \
            libgcc glibc ffmpeg mesa sqlite vulkan-icd-loader \
            qt6-base qt6-declarative qt6-grpc qt6-websockets zstd hicolor-icon-theme \
            cmake rust clang lld llvm vulkan-headers ninja qt6-tools qt6-shadertools
          git lfs install --system

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create build user
        run: |
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Install lito from the AUR
        run: |
          sudo -u builder -H bash -c '
            set -e
            cd ~ && git clone https://aur.archlinux.org/lito-bin.git
            cd lito-bin && makepkg -si --noconfirm
          '

      - name: Build package
        working-directory: packaging/arch
        run: |
          sudo -u builder -H env MAKEFLAGS="-j$(nproc)" makepkg -s --noconfirm
          ls -l *.pkg.tar.zst

      - uses: actions/upload-artifact@v4
        with:
          name: waywallen-arch-x86_64
          path: packaging/arch/*.pkg.tar.zst

      - name: Publish rolling arch-latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete arch-latest --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create arch-latest packaging/arch/*.pkg.tar.zst \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Arch Linux package (latest main)" \
            --notes "Built from ${GITHUB_SHA::7}. Install with: sudo pacman -U waywallen-git-*.pkg.tar.zst"

      - name: Attach to tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes ""
          gh release upload "$GITHUB_REF_NAME" packaging/arch/*.pkg.tar.zst \
            --repo "$GITHUB_REPOSITORY" --clobber
